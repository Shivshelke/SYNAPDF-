<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="SYNAPDF — Complete client-side PDF Workbench for reading, organizing, annotating, and editing PDFs." />
    <meta name="theme-color" content="#19191c" />
    <title>SYNAPDF — Complete PDF Workbench</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link data-trunk rel="copy-file" href="favicon.svg" />
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0f1117;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
      }

      /* Premium Loading Screen */
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #181b24 0%, #0e1016 100%);
        color: #f8fafc;
        z-index: 9999;
        transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
      }
      #loading.loaded {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .loader-logo-wrap {
        position: relative;
        width: 64px;
        height: 64px;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .spinner-ring {
        position: absolute;
        inset: 0;
        border: 3px solid rgba(0, 102, 255, 0.15);
        border-top-color: #0066ff;
        border-right-color: #38bdf8;
        border-radius: 50%;
        animation: spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
      }
      .loader-icon {
        width: 28px;
        height: 28px;
        color: #0066ff;
      }
      .loading-badge {
        display: inline-flex;
        align-items: center;
        padding: 4px 12px;
        border-radius: 999px;
        background: rgba(0, 102, 255, 0.12);
        border: 1px solid rgba(0, 102, 255, 0.3);
        color: #60a5fa;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin-bottom: 12px;
      }
      .loading-title {
        font-size: 1.6rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 0 0 6px 0;
        background: linear-gradient(135deg, #ffffff 40%, #94a3b8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .loading-subtitle {
        font-size: 0.88rem;
        color: #94a3b8;
        margin: 0;
        font-weight: 400;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="loader-logo-wrap">
        <div class="spinner-ring"></div>
        <svg class="loader-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
      </div>
      <div class="loading-badge">WebAssembly Core</div>
      <h1 class="loading-title">SYNAPDF</h1>
      <p class="loading-subtitle">Initializing secure client-side PDF workbench...</p>
    </div>
    <canvas id="synapdf"></canvas>

    <script>
      window.addEventListener('TrunkApplicationStarted', function() {
        var loader = document.getElementById('loading');
        if (loader) {
          loader.classList.add('loaded');
          setTimeout(function() {
            if (loader.parentNode) {
              loader.parentNode.removeChild(loader);
            }
          }, 400);
        }
      });
    </script>
  </body>
</html>
